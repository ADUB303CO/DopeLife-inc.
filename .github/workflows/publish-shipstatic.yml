name: Publish DopeLife to ShipStatic

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'assets/css/**'
      - 'assets/js/**'
      - '.github/workflows/publish-shipstatic.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never run concurrent deployments that could relink the same live domain out of order.
concurrency:
  group: dopelife-shipstatic-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed master commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate JavaScript syntax
        run: node --check assets/js/main.js

      - name: Stage only the public site files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/css/styles.css
          test -s assets/js/main.js
          mkdir -p site/assets/css site/assets/js
          cp index.html site/index.html
          cp assets/css/styles.css site/assets/css/styles.css
          cp assets/js/main.js site/assets/js/main.js

      - name: Check whether ShipStatic has been connected
        id: ship_token
        shell: bash
        env:
          SHIP_TOKEN: ${{ secrets.SHIP_TOKEN }}
        run: |
          if [ -n "$SHIP_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'ShipStatic automatic publishing is not active until SHIP_TOKEN is configured.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Create a ShipStatic API key in your connected account and add it as the GitHub Actions repository secret SHIP_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish and link production domain
        if: ${{ steps.ship_token.outputs.configured == 'true' }}
        uses: shipstatic/action@48bf886580624926569d5b7555154063d8accd52 # v3.0.1
        with:
          token: ${{ secrets.SHIP_TOKEN }}
          path: ./site
          domain: dopelife-inc.shipstatic.com
          labels: 'dopelife,production'
          github-token: ''

      - name: Report missing connection
        if: ${{ steps.ship_token.outputs.configured != 'true' }}
        shell: bash
        run: |
          echo 'No deployment attempted: configure SHIP_TOKEN, then rerun this workflow.'
